name: CI

on:
  pull_request:
    # labeled: adding the `native` label starts the native jobs (see native-build).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, kotlin-migration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: JVM verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  # Linux native binaries. Scripts and the distro matrix are in ci/native/; they also run locally.
  # The native jobs run on pushes, on PRs into main, and on PRs labeled `native`; otherwise they
  # are skipped (native-test and native-distros follow native-build). A skipped required check
  # counts as passed, but PRs into main always run them.
  native-build:
    name: Native build (${{ matrix.arch }})
    if: github.event_name == 'push' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      # GraalVM and the musl toolchain; build.sh pins their versions and checksums.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/lighten-ci/dl
          key: native-dl-${{ matrix.arch }}-${{ hashFiles('ci/native/build.sh') }}
      # Gradle user home of the build container: wrapper distribution and dependencies.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/lighten-ci/gradle/wrapper/dists
            ~/.cache/lighten-ci/gradle/caches/modules-2
          key: native-gradle-${{ matrix.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '*.gradle.kts') }}
          restore-keys: native-gradle-${{ matrix.arch }}-
      - run: ci/native/build.sh ${{ matrix.arch }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: lighten-linux-${{ matrix.arch }}
          path: dist/lighten
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: jvm-reference-${{ matrix.arch }}
          path: dist/jvm-reference.txt
          if-no-files-found: error
          retention-days: 3

  native-test:
    name: Native test (${{ matrix.arch }})
    needs: native-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lighten-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: jvm-reference-${{ matrix.arch }}
          path: dist
      - name: Install expect, terminfo and pyte
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends expect ncurses-term python3-pyte
      - name: CLI comparison and TUI checks
        run: |
          chmod +x dist/lighten
          ci/native/test.sh dist/lighten dist/jvm-reference.txt full results
      - name: Rendered TUI screens
        if: ${{ !cancelled() }}
        run: |
          status=0
          python3 ci/native/render.py results/tui-xterm-256color.log 80x24 120x30 > results/screens.txt || status=$?
          {
            echo "### TUI screens, ${{ matrix.arch }}, TERM=xterm-256color"
            echo '```'
            cat results/screens.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: native-test-${{ matrix.arch }}
          path: |
            results/screens.txt
            results/*.log
            results/native-transcript.txt
          retention-days: 3

  native-distros:
    name: Native distros (${{ matrix.arch }})
    needs: native-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, asset: linux-x86_64-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, asset: linux-aarch64-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lighten-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: jvm-reference-${{ matrix.arch }}
          path: dist
      - run: |
          chmod +x dist/lighten
          ci/native/distros.sh ${{ matrix.arch }} dist results
      # install.sh against this build under its release name (release.yml), on the same distros.
      - name: Install script
        if: ${{ !cancelled() }}
        run: |
          shellcheck -s sh install.sh ci/install/scenarios.sh
          shellcheck ci/install/test.sh
          version=$(dist/lighten --version)
          version=${version#lighten }
          mkdir assets
          cp dist/lighten "assets/lighten-$version-${{ matrix.asset }}"
          (cd assets && sha256sum lighten-* > SHA256SUMS)
          ci/install/test.sh ${{ matrix.arch }} assets
