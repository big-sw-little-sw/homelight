[versions]
kotlin = "2.4.20"
clikt = "5.1.0"
kotlinx-serialization = "1.11.0"

[libraries]
tamboui-bom = { module = "dev.tamboui:tamboui-bom", version = "0.5.0" }
tamboui-toolkit = { module = "dev.tamboui:tamboui-toolkit" }
tamboui-jline3-backend = { module = "dev.tamboui:tamboui-jline3-backend" }
tamboui-toolkit-markdown = { module = "dev.tamboui:tamboui-toolkit-markdown" }
clikt-core = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-bom = { module = "org.junit:junit-bom", version = "5.12.0" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.8" }
